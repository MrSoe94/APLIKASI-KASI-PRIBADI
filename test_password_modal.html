<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Password Modal</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 10% auto; padding: 20px; border-radius: 10px; width: 90%; max-width: 500px; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: #000; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="password"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button.btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button.btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Test Password Modal</h1>
    <button id="passwordBtn" onclick="showPasswordModal()">Ganti Password</button>
    
    <!-- Password Modal -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-lock"></i> Ganti Password</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="passwordForm" onsubmit="handlePasswordChange(event)">
                    <div class="form-group">
                        <label for="currentPassword">Password Saat Ini</label>
                        <input type="password" id="currentPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Password Baru</label>
                        <input type="password" id="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Konfirmasi Password</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn">Ganti Password</button>
                </form>
            </div>
        </div>
    </div>

    <div id="output"></div>

    <script>
        function showPasswordModal() {
            console.log('showPasswordModal called');
            const modal = document.getElementById('passwordModal');
            console.log('modal element:', modal);
            
            // Reset form
            document.getElementById('passwordForm').reset();
            
            // Show modal
            if (modal) {
                modal.style.display = 'block';
                console.log('Modal should be visible now');
                document.getElementById('output').innerHTML = '<p style="color: green;">Modal opened successfully!</p>';
            } else {
                console.error('Password modal not found!');
                document.getElementById('output').innerHTML = '<p style="color: red;">Error: Modal not found!</p>';
            }
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.style.display = 'none';
            });
            document.getElementById('output').innerHTML = '<p>Modal closed</p>';
        }

        async function handlePasswordChange(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                document.getElementById('output').innerHTML = '<p style="color: red;">Password baru tidak cocok</p>';
                return;
            }
            
            // Simple hardcoded password verification (temporary fix)
            if (currentPassword !== '123456') {
                document.getElementById('output').innerHTML = '<p style="color: red;">Password saat ini salah</p>';
                return;
            }
            
            try {
                // For now, just show success message (temporary fix)
                closeModal();
                document.getElementById('passwordForm').reset();
                document.getElementById('output').innerHTML = '<p style="color: green;">Password berhasil diubah (simulasi)</p>';
            } catch (error) {
                console.error('Failed to change password:', error);
                document.getElementById('output').innerHTML = '<p style="color: red;">Gagal mengubah password</p>';
            }
        }
    </script>
</body>
</html>
