<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Test</title>
</head>
<body>
    <h1>Manual Test Page</h1>
    <p>Open browser console and click the button below to test</p>
    
    <button id="passwordBtn" style="padding: 10px; background: blue; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Ganti Password
    </button>
    
    <div id="passwordModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="background: white; margin: 10% auto; padding: 20px; width: 80%; max-width: 500px; border-radius: 10px;">
            <h2>Ganti Password</h2>
            <p>This is a test modal. If you can see this, the button works!</p>
            <button onclick="closeModal()" style="padding: 5px 10px; background: red; color: white; border: none; border-radius: 5px;">Close</button>
        </div>
    </div>

    <script>
        function showPasswordModal() {
            console.log('showPasswordModal called!');
            const modal = document.getElementById('passwordModal');
            if (modal) {
                modal.style.display = 'block';
                console.log('Modal displayed!');
            } else {
                console.error('Modal not found!');
            }
        }

        function closeModal() {
            const modal = document.getElementById('passwordModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        // Add event listener
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('passwordBtn');
            if (btn) {
                btn.addEventListener('click', showPasswordModal);
                console.log('Event listener attached to button');
            } else {
                console.error('Button not found!');
            }
        });
    </script>
</body>
</html>
